[package]
name = "peaceemu-nes"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
description = "Nintendo Entertainment System emulation core for PeaceEmu"

[lib]
name = "peaceemu_nes"
path = "src/lib.rs"

[features]
default = []
peaceemu-host = ["dep:emulation-core"]

[dependencies]
emulation-core = { git = "https://github.com/Likounsee/PeaceEmu.git", branch = "PeaceEmu", package = "emulation-core", optional = true }
