name: NES core checks

on:
  push:
    branches: [main, NES]
    paths:
      - "NES/**"
      - ".github/workflows/nes.yml"
  pull_request:
    branches: [main, NES]
    paths:
      - "NES/**"
      - ".github/workflows/nes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust formatting, tests and Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NES
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  windows-game-window:
    name: Windows game window and PCM build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: NES
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Windows frontend
        run: cargo check --all-targets --locked
