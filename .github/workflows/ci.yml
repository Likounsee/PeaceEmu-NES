name: NES module CI

on:
  push:
    branches: [NES]
  pull_request:
    branches: [NES]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nes-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check out pinned NES diagnostic ROMs
        uses: actions/checkout@v4
        with:
          repository: christopherpow/nes-test-roms
          ref: 95d8f621ae55cee0d09b91519a8989ae0e64753b
          path: ${{ github.workspace }}/test-roms
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path NES/Cargo.toml
      - name: Run tests
        run: cargo test --manifest-path NES/Cargo.toml --locked
      - name: Run Blargg CPU diagnostic ROMs
        env:
          PEACEEMU_NES_TEST_ROM_DIR: ${{ github.workspace }}/test-roms
        run: cargo test --manifest-path NES/Cargo.toml --features ppu-timing-diagnostics --test rom_conformance --locked -- --nocapture
      - name: Run experimental Blargg APU diagnostic ROMs
        env:
          PEACEEMU_NES_APU_TEST_ROM_DIR: ${{ github.workspace }}/test-roms
        run: cargo test --manifest-path NES/Cargo.toml --features ppu-timing-diagnostics --test rom_conformance --locked -- --nocapture blargg_apu_diagnostics_experimental
      - name: Run experimental Blargg PPU diagnostic ROMs
        env:
          PEACEEMU_NES_PPU_TEST_ROM_DIR: ${{ github.workspace }}/test-roms
        run: cargo test --manifest-path NES/Cargo.toml --features ppu-timing-diagnostics --test rom_conformance --locked -- --nocapture blargg_ppu_diagnostics_experimental
      - name: Build desktop module
        run: cargo build --manifest-path NES/Cargo.toml --bin peaceemu-nes-desktop --release --locked
      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v4
        with:
          name: peaceemu-nes-desktop-${{ runner.os }}
          path: NES/target/release/peaceemu-nes-desktop*
          if-no-files-found: error
          retention-days: 7
      - name: Run Clippy
        run: cargo clippy --manifest-path NES/Cargo.toml --all-targets --locked -- -D warnings
