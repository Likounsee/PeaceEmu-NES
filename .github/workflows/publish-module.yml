name: Publish NES desktop module

on:
  push:
    tags:
      - "nes-module-*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to create or update (for example nes-module-0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nes-module-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-windows-x64:
    name: Build and publish Windows x64 module
    runs-on: windows-latest
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^nes-module-(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must use nes-module-MAJOR.MINOR.PATCH."
          }

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the standalone desktop module
        run: cargo build --manifest-path NES/Cargo.toml --bin peaceemu-nes-desktop --release --locked

      - name: Prepare release assets and SHA-256
        shell: pwsh
        run: |
          $exe = "NES/target/release/peaceemu-nes-desktop.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            throw "Expected module executable was not produced: $exe"
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  peaceemu-nes-desktop.exe" | Set-Content -Path "NES/target/release/peaceemu-nes-desktop.exe.sha256" -Encoding ascii
          Get-Item $exe | Select-Object Name, Length
          Get-Content "NES/target/release/peaceemu-nes-desktop.exe.sha256"

      - name: Remove previous development release and tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $tags = gh release list --limit 100 --json tagName | ConvertFrom-Json
          foreach ($release in $tags) {
            $oldTag = $release.tagName
            if ($oldTag -like "nes-module-*" -and $oldTag -ne $env:CURRENT_TAG) {
              Write-Host "Removing previous development release and tag: $oldTag"
              gh release delete $oldTag --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { throw "Could not delete previous release/tag $oldTag" }
            }
          }
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PeaceEmu NES module ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            NES/target/release/peaceemu-nes-desktop.exe
            NES/target/release/peaceemu-nes-desktop.exe.sha256
