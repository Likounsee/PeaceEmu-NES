name: NES module releases

on:
  # Development commits must never publish or replace downloadable releases.
  # Use the dedicated tag-based publish workflow when a version is ready.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nes-module-development-release
  cancel-in-progress: false

jobs:
  windows-module:
    runs-on: windows-latest
    steps:
      - name: Check out module repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build standalone NES module
        working-directory: NES
        run: cargo build --release --locked --bin peaceemu-nes-desktop
      - name: Package executable and SHA-256
        shell: pwsh
        run: |
          $exe = "NES/target/release/peaceemu-nes-desktop.exe"
          if (!(Test-Path $exe)) { throw "NES executable was not produced" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii "NES/target/release/peaceemu-nes-desktop.exe.sha256" "$hash  peaceemu-nes-desktop.exe"
      - name: Remove previous development release and tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: nes-module-0.1.${{ github.run_number }}
        run: |
          $tags = gh release list --limit 100 --json tagName | ConvertFrom-Json
          foreach ($release in $tags) {
            $oldTag = $release.tagName
            if ($oldTag -like "nes-module-*" -and $oldTag -ne $env:CURRENT_TAG) {
              Write-Host "Removing previous development release and tag: $oldTag"
              gh release delete $oldTag --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { throw "Could not delete previous release/tag $oldTag" }
            }
          }
      - name: Publish versioned downloadable module
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nes-module-0.1.${{ github.run_number }}
          name: PeaceEmu NES module 0.1.${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            NES/target/release/peaceemu-nes-desktop.exe
            NES/target/release/peaceemu-nes-desktop.exe.sha256
